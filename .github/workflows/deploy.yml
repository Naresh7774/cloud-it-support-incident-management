name: Cloud Incident Management CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required for actions/checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Continuous Integration - Lint, Test & Static Builds

  ci-test-and-build:
    name: Test & Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Backend Tests
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Automated Test Suite
        working-directory: ./backend
        run: npm test

      # Frontend Build
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React Frontend
        working-directory: ./frontend
        run: npm run build

  # ===============================================================
  # Stage 2: Docker Build & Push to Amazon ECR (Main branch only)
  # ===============================================================
  build-and-push-ecr:
    name: Build & Push Images to Amazon ECR
    needs: ci-test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ecr_registry: ${{ steps.login-ecr.outputs.registry }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate securely with AWS using GitHub OIDC Role
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and Push Backend Image
      - name: Build, Tag and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_BACKEND_REPO || 'cloud-incident-backend' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Build and Push Frontend Image
      - name: Build, Tag and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPO || 'cloud-incident-frontend' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  
#  Stage 3: Continuous Deployment - Deploy to AWS EC2
  
  deploy-to-ec2:
    name: Deploy Application to AWS EC2
    needs: build-and-push-ecr
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup SSH Key & Known Hosts
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Copy Deployment Scripts & Configs to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST "mkdir -p ~/app/scripts ~/app/nginx ~/app/database"
          scp -i ~/.ssh/deploy_key docker-compose.yml $EC2_USER@$EC2_HOST:~/app/docker-compose.yml
          scp -i ~/.ssh/deploy_key nginx/default.conf $EC2_USER@$EC2_HOST:~/app/nginx/default.conf
          scp -i ~/.ssh/deploy_key nginx/nginx.conf $EC2_USER@$EC2_HOST:~/app/nginx/nginx.conf
          scp -i ~/.ssh/deploy_key database/init.sql $EC2_USER@$EC2_HOST:~/app/database/init.sql
          scp -i ~/.ssh/deploy_key scripts/deploy.sh $EC2_USER@$EC2_HOST:~/app/scripts/deploy.sh
          scp -i ~/.ssh/deploy_key scripts/backup.sh $EC2_USER@$EC2_HOST:~/app/scripts/backup.sh
          scp -i ~/.ssh/deploy_key scripts/restore.sh $EC2_USER@$EC2_HOST:~/app/scripts/restore.sh
          scp -i ~/.ssh/deploy_key scripts/validate-backup.sh $EC2_USER@$EC2_HOST:~/app/scripts/validate-backup.sh

      - name: Execute Remote Deployment Script
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          ECR_REGISTRY: ${{ needs.build-and-push-ecr.outputs.ecr_registry }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        run: |
          ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST \
            "export ECR_REGISTRY=$ECR_REGISTRY AWS_REGION=$AWS_REGION && bash ~/app/scripts/deploy.sh"
